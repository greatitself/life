name: Life matched native performance closure

on:
  workflow_dispatch:
    inputs:
      candidate_source:
        description: 'Exact source commit with all functional CI gates passed'
        required: true
        type: string
      verified_run:
        description: 'Successful full Verify Life run for that source commit'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  matched-native-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
      VERIFIED_RUN: ${{ inputs.verified_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_source }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .performance-inputs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require complete functional verification of the exact source
        shell: bash
        run: |
          mkdir -p output
          gh run view "$VERIFIED_RUN" --repo greatitself/life --json status,conclusion,headSha,jobs > output/performance-upstream-run.json
          node <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const proof = JSON.parse(fs.readFileSync('output/performance-upstream-run.json'))
          assert.match(process.env.CANDIDATE_SOURCE, /^[a-f0-9]{40}$/)
          assert.equal(proof.headSha, process.env.CANDIDATE_SOURCE)
          assert.equal(proof.status, 'completed')
          assert.equal(proof.conclusion, 'success')
          for (const name of ['verify', 'Linux native active recovery', 'Windows packaged native compatibility'])
            assert(proof.jobs.some(job => job.name === name && job.conclusion === 'success'), name)
          assert.equal(proof.jobs.filter(job => /^Linux native /.test(job.name) && job.name !== 'Linux native active recovery' && job.conclusion === 'success').length, 11)
          assert.equal(proof.jobs.filter(job => /^Linux metadata quit /.test(job.name) && job.conclusion === 'success').length, 4)
          NODE
          gh run download "$VERIFIED_RUN" --repo greatitself/life --name life-linux-verified-build --dir .
      - run: npm ci
      - name: Verify exact source and compiled artifact
        run: node tests/helpers/verified-ci-build.cjs
      - run: npx playwright install chromium --with-deps
      - name: Prepare the frozen baseline and identical current dependencies
        run: node .performance-inputs/tests/native-registry-performance/hosted-prepare.cjs
      - name: Run the existing eight matched pairs and separate durability probe
        env:
          LIFE_NATIVE_REGISTRY_REPOSITORY: ${{ github.workspace }}
          LIFE_NATIVE_REGISTRY_BASELINE: ${{ github.workspace }}/output/immutable-app/performance-baseline
          LIFE_NATIVE_REGISTRY_ATTEMPT: ${{ github.workspace }}/output/native-registry-performance/attempt
        run: |
          mkdir -p "$LIFE_NATIVE_REGISTRY_ATTEMPT"
          node .performance-inputs/tests/native-registry-performance/run-paired.cjs --candidate "$GITHUB_WORKSPACE/output/immutable-app/performance-candidate" --lease "$GITHUB_WORKSPACE/output/native-registry-performance/quiet-lease.json"
      - name: Reverify the candidate source and compiled artifact
        if: always()
        run: node tests/helpers/verified-ci-build.cjs
      - name: Retain measurements and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-matched-native-performance
          path: |
            output/native-registry-performance/
            output/performance-upstream-run.json
          if-no-files-found: error
