name: Release Life

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and release'
        required: true
        type: string
      source_ref:
        description: 'Source commit, branch, or tag for a rebuild (defaults to the version tag)'
        required: false
        type: string

permissions:
  contents: read

env:
  LIFE_RELEASE_REF: ${{ inputs.source_ref || inputs.tag || github.ref }}
  LIFE_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LIFE_RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        run: node -e "if (process.env.LIFE_RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag must match package.json version')"
      - name: Record release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run test:recovery
      - run: node tests/thread-queue-smoke.cjs
      - run: node tests/thread-presentation-smoke.cjs
      - run: node tests/studio-lifecycle-smoke.cjs
      - run: node tests/app-live-controls-smoke.cjs
      - run: node tests/app-live-controls-smoke.cjs --presentation
      - run: node tests/run-selectors-smoke.cjs
      - run: node tests/research-method-ui-smoke.cjs
      - run: xvfb-run -a npm run test:desktop

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            args: --linux --x64
          - platform: windows-x64
            runner: windows-latest
            args: --win --x64
          - platform: macos-arm64
            runner: macos-latest
            args: --mac --arm64
          - platform: macos-x64
            runner: macos-15-intel
            args: --mac --x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Verify packaged Windows live customization
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./tests/windows-source-runtime.ps1
      - name: Save Windows customization proof
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: life-windows-customization-proof
          path: output/source-runtime-proof.json
          if-no-files-found: error
      - name: Check out maintained Windows verification
        if: matrix.platform == 'windows-x64'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-verification
          sparse-checkout: tests/windows-upgrade.ps1
          sparse-checkout-cone-mode: false
      - name: Verify Windows upgrades from Life 0.1.0, 0.5.1, 0.6.0, 0.7.0 and 0.8.0
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./.release-verification/tests/windows-upgrade.ps1 -Installer (Get-ChildItem release/*.exe | Select-Object -First 1).FullName -ExpectedVersion (Get-Content -Raw package.json | ConvertFrom-Json).version -BaselineVersions @('0.1.0','0.5.1','0.6.0','0.7.0','0.8.0')
      - name: Save Windows upgrade proof
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: life-windows-upgrade-proof
          path: output/windows-upgrade-proof.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: life-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          path: checkout
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.LIFE_RELEASE_TAG }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd installers
          sha256sum Life-* latest*.yml > SHA256SUMS.txt
          notes="../checkout/docs/release-notes-${RELEASE_TAG}.md"
          cp "$notes" release-notes.md
          printf '\nBuild source: [%s](https://github.com/%s/commit/%s).\n' "$SOURCE_COMMIT" "$GH_REPO" "$SOURCE_COMMIT" >> release-notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Life $RELEASE_TAG" --notes-file release-notes.md
          fi
          assets=(Life-* latest*.yml SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --title "Life $RELEASE_TAG" --notes-file release-notes.md
