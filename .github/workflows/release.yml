name: Release Life

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: xvfb-run -a npm run test:desktop

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            args: --linux --x64
          - platform: windows-x64
            runner: windows-latest
            args: --win --x64
          - platform: macos-arm64
            runner: macos-latest
            args: --mac --arm64
          - platform: macos-x64
            runner: macos-15-intel
            args: --mac --x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Verify Windows upgrade from Life 0.1.0
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./tests/windows-upgrade.ps1 -Installer (Get-ChildItem release/*.exe | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: life-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd installers
          sha256sum Life-* latest*.yml > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Life 0.2 is a customizable research workspace for Codex and Claude Code over SSH.

          - Monochrome dark and light themes, a new Life logo, and official SVGL company icons.
          - Research map with Mermaid diagrams, dependencies, notes, filters, and project backups.
          - Agent workspace with remote files, Git changes, terminal, and provider approvals.
          - SSH config aliases, resolved options, and ProxyJump with trusted OpenSSH jump hosts.
          - Prompt-driven live settings, commands, panels, executable UI/backend extensions, hot reload and rollback.
          - Windows installer upgrades the existing Life installation; in-app updates for future Windows releases.

          Windows users on 0.1.0: run the new .exe once to upgrade. Profiles, conversation history, and local research data are preserved. Then use Updates inside Life for subsequent releases. Executable extensions can replace views and add local behavior immediately. Electron/native dependency and installer changes still require a source build.

          Agent CLIs must be installed and signed in on the remote Linux or macOS machine. Builds are unsigned; macOS users may need to use Open Anyway in System Settings, and Windows may show an unrecognized publisher prompt. macOS and Debian updates use the new installer; AppImage and Windows support in-app updates.
          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Life $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" Life-* latest*.yml SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
