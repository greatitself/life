name: Verify Life

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      regressions_only:
        description: 'Run release regression checks without the full native matrix'
        required: false
        default: false
        type: boolean
      studio_only:
        description: 'Focus the diagnostic desktop run on Studio; full verification is unchanged'
        required: false
        default: false
        type: boolean
      native_diagnostics:
        description: 'Run focused native diagnostics; never qualifies for release publication'
        required: false
        default: false
        type: boolean
      native_suite:
        description: 'Native diagnostic suite'
        required: false
        default: all
        type: choice
        options: [all, active-recovery, navigation, ownership, ssh-allocated]
      windows_only:
        description: 'Run only packaged Windows compatibility while diagnosing that gate'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit shard ${{ matrix.shard }}/4
    if: inputs.windows_only != true && inputs.regressions_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run every test in this shard with one worker
        timeout-minutes: 30
        shell: bash
        run: |
          mkdir -p output
          npm test -- --maxWorkers=1 --shard=${{ matrix.shard }}/4 --reporter=verbose 2>&1 | tee output/unit-shard-${{ matrix.shard }}.log
      - name: Save unit test results even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-unit-shard-${{ matrix.shard }}-log
          path: output/unit-shard-${{ matrix.shard }}.log
          if-no-files-found: warn

  verify:
    if: inputs.windows_only != true && inputs.regressions_only != true
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Capture source before the Linux build
        run: node scripts/record-recovery-build.cjs capture-source output/linux-source-before.json
      - run: npm run build
      - name: Record the Linux compiled build
        shell: bash
        run: |
          node scripts/record-recovery-build.cjs capture-source output/linux-source-after.json
          node <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const path = require('node:path')
          const crypto = require('node:crypto')
          const child = require('node:child_process')
          const before = JSON.parse(fs.readFileSync('output/linux-source-before.json'))
          const after = JSON.parse(fs.readFileSync('output/linux-source-after.json'))
          assert.deepEqual(after, before, 'Source changed during the build')
          const compiled = []
          function visit(name) {
            const stat = fs.lstatSync(name)
            assert(!stat.isSymbolicLink(), 'Compiled links are rejected')
            if (stat.isDirectory()) {
              for (const entry of fs.readdirSync(name).sort()) visit(path.join(name, entry))
            } else {
              assert(stat.isFile())
              const bytes = fs.readFileSync(name)
              compiled.push({ path: name, mode: stat.mode & 0o7777, bytes: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex') })
            }
          }
          visit('out')
          const sourceCommit = child.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          fs.writeFileSync('output/linux-compiled-build.json', JSON.stringify({ sourceCommit, platform: process.platform, arch: process.arch, source: before.sourceBefore, compiled }, null, 2) + '\n')
          NODE
      - run: npx playwright install chromium --with-deps
      - run: npm run test:recovery
        id: release_check_01
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/thread-queue-smoke.cjs
        id: release_check_02
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/thread-presentation-smoke.cjs
        id: release_check_03
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/studio-lifecycle-smoke.cjs
        id: release_check_04
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/app-live-controls-smoke.cjs
        id: release_check_05
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/app-live-controls-smoke.cjs --presentation
        id: release_check_06
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/app-live-controls-smoke.cjs --history-hydration
        id: release_check_07
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/app-live-controls-smoke.cjs --provider-utilities
        id: release_check_08
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/app-live-controls-smoke.cjs --fluidity
        id: release_check_09
        continue-on-error: true
        timeout-minutes: 15
      - name: Verify thread organization and draft workflows
        id: release_check_10
        continue-on-error: true
        timeout-minutes: 15
        run: node tests/thread-workflows-smoke.cjs
      - run: node tests/transcript-performance.cjs current
        id: release_check_11
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/agent-event-batch-performance.cjs
        id: release_check_12
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/sidebar-history-performance.cjs current
        id: release_check_13
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/conversation-history-performance.cjs
        id: release_check_14
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/workspace-surfaces-performance.cjs
        id: release_check_15
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/conversation-scroll-performance.cjs
        id: release_check_16
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/thread-message-navigator-smoke.cjs
        id: release_check_17
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/thread-finder-timeline-smoke.cjs
        id: release_check_18
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/settled-markdown-smoke.cjs
        id: release_check_19
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/native-checkpoint-performance.cjs
        id: release_check_20
        continue-on-error: true
        timeout-minutes: 15
      - run: npm run test:checkpoints
        id: release_check_21
        continue-on-error: true
        timeout-minutes: 15
      - run: npm run test:loads
        id: release_check_22
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/studio-layout-smoke.cjs
        id: release_check_23
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/run-selectors-smoke.cjs
        id: release_check_24
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/research-method-ui-smoke.cjs
        id: release_check_25
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/provider-request-ui-smoke.cjs
        id: release_check_26
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/conversation-scroll-smoke.cjs
        id: release_check_27
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/provider-updates-ui-smoke.cjs
        id: release_check_28
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/usage-smoke.cjs
        id: release_check_29
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/updates-ui-smoke.cjs
        id: release_check_30
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/graph-canvas-smoke.cjs
        id: release_check_31
        continue-on-error: true
        timeout-minutes: 15
      - run: node tests/deferred-dialogs-smoke.cjs
        id: release_check_32
        continue-on-error: true
        timeout-minutes: 15
      - run: npm run test:desktop
        id: release_check_33
        continue-on-error: true
        timeout-minutes: 30
      - run: npm run format:check
        id: release_check_34
        continue-on-error: true
        timeout-minutes: 15
      - name: Require every existing workflow check to pass
        if: always()
        env:
          WORKFLOW_CHECK_RESULTS: ${{ toJSON(steps) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const assert = require('node:assert/strict')
          const steps = JSON.parse(process.env.WORKFLOW_CHECK_RESULTS)
          const commands = ["npm run test:recovery", "node tests/thread-queue-smoke.cjs", "node tests/thread-presentation-smoke.cjs", "node tests/studio-lifecycle-smoke.cjs", "node tests/app-live-controls-smoke.cjs", "node tests/app-live-controls-smoke.cjs --presentation", "node tests/app-live-controls-smoke.cjs --history-hydration", "node tests/app-live-controls-smoke.cjs --provider-utilities", "node tests/app-live-controls-smoke.cjs --fluidity", "node tests/thread-workflows-smoke.cjs", "node tests/transcript-performance.cjs current", "node tests/agent-event-batch-performance.cjs", "node tests/sidebar-history-performance.cjs current", "node tests/conversation-history-performance.cjs", "node tests/workspace-surfaces-performance.cjs", "node tests/conversation-scroll-performance.cjs", "node tests/thread-message-navigator-smoke.cjs", "node tests/thread-finder-timeline-smoke.cjs", "node tests/settled-markdown-smoke.cjs", "node tests/native-checkpoint-performance.cjs", "npm run test:checkpoints", "npm run test:loads", "node tests/studio-layout-smoke.cjs", "node tests/run-selectors-smoke.cjs", "node tests/research-method-ui-smoke.cjs", "node tests/provider-request-ui-smoke.cjs", "node tests/conversation-scroll-smoke.cjs", "node tests/provider-updates-ui-smoke.cjs", "node tests/usage-smoke.cjs", "node tests/updates-ui-smoke.cjs", "node tests/graph-canvas-smoke.cjs", "node tests/deferred-dialogs-smoke.cjs", "npm run test:desktop", "npm run format:check"]
          const results = commands.map((command, index) => {
            const id = 'release_check_' + String(index + 1).padStart(2, '0')
            return { id, command, outcome: steps[id]?.outcome ?? 'missing' }
          })
          fs.mkdirSync('output', { recursive: true })
          fs.writeFileSync('output/linux-workflow-results.json', JSON.stringify(results, null, 2) + '\n')
          const failed = results.filter(result => result.outcome !== 'success')
          for (const result of failed) console.error(result.command + ': ' + result.outcome)
          assert.equal(failed.length, 0, 'Every existing browser, desktop, performance and format check must pass')
          NODE
      - name: Save workflow diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-linux-workflow-results
          path: output/linux-workflow-results.json
          if-no-files-found: warn
      - name: Save the verified Linux build for native checks
        uses: actions/upload-artifact@v4
        with:
          name: life-linux-verified-build
          path: |
            out/
            output/linux-source-before.json
            output/linux-source-after.json
            output/linux-compiled-build.json
          if-no-files-found: error
      - name: Preserve workflow failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-linux-workflow-failures
          path: |
            output/playwright/**/*failure*.json
            output/playwright/**/failed-fixture-cleanup.json
            output/playwright/**/*.png
          if-no-files-found: warn

  linux-active-recovery:
    name: Linux native active recovery
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: life-linux-verified-build
      - run: node tests/helpers/verified-ci-build.cjs
      - run: npx playwright install-deps chromium
      - name: Verify SSH recovery, source commits, and renderer reload
        run: npm run test:active-recovery
      - name: Verify Local Codex active recovery
        run: node tests/active-recovery-run.cjs local-codex-stream
      - name: Verify Local Claude approval recovery
        run: node tests/active-recovery-run.cjs local-claude-approval
      - name: Verify the original source and compiled build are preserved
        run: node tests/helpers/verified-ci-build.cjs
      - name: Save active recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-linux-active-recovery-proof
          path: output/playwright/active-recovery-run/
          if-no-files-found: warn

  linux-native-workflows:
    name: Linux native ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {
              name: local-switch,
              fixture: local-switch-native-smoke.cjs,
              external_display: true,
              packaged: false,
            }
          - {
              name: streaming,
              fixture: conversation-streaming-electron-smoke.cjs,
              external_display: true,
              packaged: false,
            }
          - {
              name: navigation,
              fixture: renderer-navigation-electron-smoke.cjs,
              external_display: true,
              packaged: false,
            }
          - {
              name: ownership,
              fixture: renderer-ownership-hmr-electron-smoke.cjs,
              external_display: true,
              packaged: false,
            }
          - {
              name: dispatch,
              fixture: renderer-document-dispatch-electron-smoke.cjs,
              external_display: false,
              packaged: false,
            }
          - {
              name: studio,
              fixture: studio-native-checkpoint-smoke.cjs,
              external_display: false,
              packaged: false,
            }
          - {
              name: ordinary-draft,
              fixture: ordinary-draft-native-checkpoint-smoke.cjs,
              external_display: false,
              packaged: false,
            }
          - {
              name: local-source,
              fixture: local-native-smoke.cjs,
              external_display: true,
              packaged: false,
            }
          - {
              name: helpers-source,
              fixture: local-owned-helpers-native.cjs,
              external_display: false,
              packaged: false,
            }
          - {
              name: local-package,
              fixture: local-native-smoke.cjs,
              external_display: true,
              packaged: true,
            }
          - {
              name: helpers-package,
              fixture: local-owned-helpers-native.cjs,
              external_display: false,
              packaged: true,
            }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LIFE_TEST_EXPECT_ARCHIVE_LOSS: '0'
      LIFE_TEST_EXPECT_DRAFT_LOSS: '0'
      LIFE_TEST_EXPECT_SOURCE_LOSS: '0'
      LIFE_TEST_EXPECT_DOCUMENT_DISPATCH: rejected
      LIFE_TEST_HMR_POLICY: guarded
      LIFE_SWITCH_EXPECT_BEFORE: '0'
      LIFE_SWITCH_ROUTES: disconnect,connect
      LIFE_NAVIGATION_FIXTURE_XVFB: '1'
      LIFE_TEST_PRIVATE_LOCAL_APPENDS_XVFB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: life-linux-verified-build
      - run: node tests/helpers/verified-ci-build.cjs
      - run: npx playwright install-deps chromium
      - name: Package the exact compiled application
        if: matrix.packaged
        run: npx electron-builder --linux --x64 --dir --publish never
      - name: Verify the packaged native filesystem
        if: matrix.name == 'local-package'
        env:
          LIFE_RECOVERY_BUILD_PROVENANCE: output/recovery-release-build.json
        run: |
          node scripts/record-recovery-build.cjs seal output/linux-source-before.json release/linux-unpacked/life-desktop output/recovery-release-build.json
          node tests/native-recovery-filesystem-probe.cjs release/linux-unpacked/life-desktop output/native-recovery-filesystem-probe/linux-x64.json
      - name: Run the existing native fixture in this disposable runner
        shell: bash
        run: |
          export LIFE_TEST_APP_ROOT="$PWD"
          export LIFE_TEST_APP_PATH="$PWD"
          export LIFE_TEST_ARTIFACTS_DIR="$PWD/output/release-native/${{ matrix.name }}"
          export LIFE_TEST_SCREENSHOTS_DIR="$LIFE_TEST_ARTIFACTS_DIR/screenshots"
          export LIFE_TEST_BACKGROUND_PID="$BASHPID"
          if [[ '${{ matrix.packaged }}' == 'true' ]]; then
            export LIFE_ELECTRON_BINARY="$PWD/release/linux-unpacked/life-desktop"
            export LIFE_HELPER_SOURCE_ROOT="$PWD/release/linux-unpacked/resources/life-source/src"
            export LIFE_TEST_SOURCE=0 LIFE_TEST_PACKAGED=1
          else
            export LIFE_HELPER_SOURCE_ROOT="$PWD/src"
            export LIFE_TEST_SOURCE=1 LIFE_TEST_PACKAGED=0
          fi
          if [[ '${{ matrix.external_display }}' == 'true' ]]; then
            xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp -extension MIT-SHM' node 'tests/${{ matrix.fixture }}'
          else
            node 'tests/${{ matrix.fixture }}'
          fi
      - name: Verify the original source and compiled build are preserved
        run: node tests/helpers/verified-ci-build.cjs
      - name: Save native workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-linux-native-${{ matrix.name }}-proof
          path: |
            output/release-native/
            output/playwright/
            output/native-recovery-filesystem-probe/
            output/recovery-release-build.json
          if-no-files-found: warn

  linux-metadata-quit:
    name: Linux metadata quit ${{ matrix.mode }}
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [local-allocated, ssh-allocated, local-preallocation, ssh-preallocation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: life-linux-verified-build
      - id: build
        run: node tests/helpers/verified-ci-build.cjs
      - run: npx playwright install-deps chromium
      - name: Verify normal quit during cold metadata startup
        env:
          LIFE_TEST_APP_PATH: ${{ github.workspace }}
          LIFE_FIXTURE_REPOSITORY: ${{ github.workspace }}
          LIFE_METADATA_QUIT_EXPECT_MAIN_SHA256: ${{ steps.build.outputs.main_sha256 }}
          LIFE_METADATA_QUIT_CASE: ${{ matrix.mode }}
          LIFE_METADATA_QUIT_ARTIFACTS: ${{ github.workspace }}/output/metadata-startup-quit/${{ matrix.mode }}
        run: node tests/metadata-startup-quit/owned-runner.cjs
      - name: Verify the original source and compiled build are preserved
        run: node tests/helpers/verified-ci-build.cjs
      - name: Save cold metadata quit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-linux-metadata-quit-${{ matrix.mode }}-proof
          path: output/metadata-startup-quit/
          if-no-files-found: warn

  windows-native-recovery:
    if: inputs.regressions_only != true
    name: Windows packaged native compatibility
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Capture source before the release build
        run: node scripts/record-recovery-build.cjs capture-source output/recovery-source-before.json
      - run: npm run build
      - name: Build unpacked Windows application
        run: npx electron-builder --win --x64 --dir --publish never
      - name: Seal build and package provenance
        run: node scripts/record-recovery-build.cjs seal output/recovery-source-before.json release/win-unpacked/Life.exe output/recovery-release-build.json
      - name: Verify packaged Windows native compatibility
        shell: pwsh
        run: ./tests/windows-native-recovery-compatibility.ps1 -BuildProvenance output/recovery-release-build.json
      - name: Save Windows compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-windows-native-recovery-proof
          path: |
            output/windows-native-recovery-compatibility/
            output/recovery-source-before.json
            output/recovery-release-build.json
          if-no-files-found: error

  matched-renderer-performance:
    name: Matched renderer performance
    if: inputs.windows_only != true && inputs.regressions_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - uses: actions/checkout@v4
        with:
          ref: v0.13.0
          path: .performance-baseline
      - name: Measure the same fixture in baseline-candidate-candidate-baseline order
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/node_modules" .performance-baseline/node_modules
          cmp tests/transcript-performance.cjs .performance-baseline/tests/transcript-performance.cjs
          (cd .performance-baseline && node tests/transcript-performance.cjs v0130-a)
          node tests/transcript-performance.cjs v0131-a
          node tests/transcript-performance.cjs v0131-b
          (cd .performance-baseline && node tests/transcript-performance.cjs v0130-b)
      - name: Measure native recovery reads with the same fixture and alternating source order
        shell: bash
        run: |
          set -euo pipefail
          node tests/native-recovery-read-performance.cjs .performance-baseline v0130-a
          node tests/native-recovery-read-performance.cjs . v0131-a
          node tests/native-recovery-read-performance.cjs . v0131-b
          node tests/native-recovery-read-performance.cjs .performance-baseline v0130-b
      - name: Retain both source measurements without treating fixture times as upstream provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-matched-renderer-performance
          if-no-files-found: error
          include-hidden-files: true
          path: |
            output/playwright/transcript-performance-v011/v0131-*.json
            .performance-baseline/output/playwright/transcript-performance-v011/v0130-*.json
            output/playwright/native-recovery-read-performance/*.json

  release-regressions:
    name: Release regression checks
    if: inputs.regressions_only == true && inputs.native_diagnostics != true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - name: Relevant ownership and release tests
        id: unit
        continue-on-error: false
        timeout-minutes: 10
        run: npm test -- --maxWorkers=1 tests/durable-channel-recovery.test.ts tests/local-switch-retirement.test.ts tests/durable-remote-channel.test.ts tests/release-baselines.test.ts tests/ordinary-renderer-admission.test.ts tests/agents-pre-admission-stop.test.ts tests/agents-native-stop-recovery.test.ts tests/agent-native-stop-recovery.test.ts tests/renderer-idle-retirement.test.ts tests/agents-native-recovery-boundaries.test.ts tests/native-recovery-store.test.ts
      - name: Studio focus regression
        id: focus
        continue-on-error: true
        timeout-minutes: 3
        run: node tests/studio-layout-smoke.cjs
      - name: Stop during renderer preparation regression
        id: preparation
        continue-on-error: true
        timeout-minutes: 3
        run: node tests/app-live-controls-smoke.cjs --presentation
      - name: Exact native history load and checkpoint regression
        id: history
        continue-on-error: true
        timeout-minutes: 10
        run: npm run test:loads
      - name: Native desktop workflow regressions
        id: desktop
        continue-on-error: true
        timeout-minutes: 30
        env:
          LIFE_TEST_PHASE: ${{ inputs.studio_only && 'features' || '' }}
          LIFE_TEST_SKIP_PRIOR_FEATURES: ${{ inputs.studio_only && '1' || '' }}
        run: npm run test:desktop
      - name: Require every selected regression check
        env:
          REGRESSION_RESULTS: ${{ toJSON(steps) }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const steps = JSON.parse(process.env.REGRESSION_RESULTS)
          const results = ['unit','focus','preparation','history','desktop'].map(name => ({name,outcome:steps[name]?.outcome || 'missing'}))
          console.log(JSON.stringify(results,null,2))
          assert(results.every(row => row.outcome === 'success'), 'All release regression checks must pass')
          NODE
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-release-regression-proof
          if-no-files-found: warn
          path: |
            output/playwright/**/*failure*.json
            output/playwright/**/failed-fixture-cleanup.json
            output/playwright/desktop-smoke.json
            output/playwright/conversation-load-electron/*.json
            output/playwright/studio-layout/proof.json
            output/playwright/**/*.png

  native-diagnostics:
    name: Focused native diagnostic / ${{ matrix.suite }}
    if: inputs.regressions_only == true && inputs.native_diagnostics == true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: ${{ fromJSON(inputs.native_suite == 'all' && '["active-recovery","navigation","ownership","ssh-allocated"]' || format('["{0}"]', inputs.native_suite)) }}
    env:
      LIFE_TEST_EXPECT_ARCHIVE_LOSS: '0'
      LIFE_TEST_EXPECT_DRAFT_LOSS: '0'
      LIFE_TEST_EXPECT_SOURCE_LOSS: '0'
      LIFE_TEST_HMR_POLICY: guarded
      LIFE_NAVIGATION_FIXTURE_XVFB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Capture source before the Linux build
        run: node scripts/record-recovery-build.cjs capture-source output/linux-source-before.json
      - run: npm run build
      - name: Record the Linux compiled build
        shell: bash
        run: |
          node scripts/record-recovery-build.cjs capture-source output/linux-source-after.json
          node <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const path = require('node:path')
          const crypto = require('node:crypto')
          const child = require('node:child_process')
          const before = JSON.parse(fs.readFileSync('output/linux-source-before.json'))
          const after = JSON.parse(fs.readFileSync('output/linux-source-after.json'))
          assert.deepEqual(after, before, 'Source changed during the build')
          const compiled = []
          function visit(name) {
            const stat = fs.lstatSync(name)
            assert(!stat.isSymbolicLink(), 'Compiled links are rejected')
            if (stat.isDirectory()) {
              for (const entry of fs.readdirSync(name).sort()) visit(path.join(name, entry))
            } else {
              assert(stat.isFile())
              const bytes = fs.readFileSync(name)
              compiled.push({ path: name, mode: stat.mode & 0o7777, bytes: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex') })
            }
          }
          visit('out')
          const sourceCommit = child.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          fs.writeFileSync('output/linux-compiled-build.json', JSON.stringify({ sourceCommit, platform: process.platform, arch: process.arch, source: before.sourceBefore, compiled }, null, 2) + '\n')
          NODE
      - id: build
        run: node tests/helpers/verified-ci-build.cjs
      - run: npx playwright install-deps chromium
      - name: Run the selected existing native fixture
        shell: bash
        env:
          NATIVE_SUITE: ${{ matrix.suite }}
          LIFE_METADATA_QUIT_EXPECT_MAIN_SHA256: ${{ steps.build.outputs.main_sha256 }}
        run: |
          export LIFE_TEST_APP_ROOT="$PWD" LIFE_TEST_APP_PATH="$PWD"
          export LIFE_FIXTURE_REPOSITORY="$PWD"
          export LIFE_TEST_ARTIFACTS_DIR="$PWD/output/native-diagnostics/$NATIVE_SUITE"
          export LIFE_TEST_SCREENSHOTS_DIR="$LIFE_TEST_ARTIFACTS_DIR/screenshots"
          export LIFE_TEST_BACKGROUND_PID="$BASHPID"
          export LIFE_HELPER_SOURCE_ROOT="$PWD/src"
          export LIFE_TEST_SOURCE=1 LIFE_TEST_PACKAGED=0
          case "$NATIVE_SUITE" in
            active-recovery)
              npm run test:active-recovery
              node tests/active-recovery-run.cjs local-codex-stream
              node tests/active-recovery-run.cjs local-claude-approval
              ;;
            ssh-allocated)
              export LIFE_METADATA_QUIT_CASE=ssh-allocated
              export LIFE_METADATA_QUIT_ARTIFACTS="$LIFE_TEST_ARTIFACTS_DIR"
              node tests/metadata-startup-quit/owned-runner.cjs
              ;;
            navigation)
              xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp -extension MIT-SHM' node tests/renderer-navigation-electron-smoke.cjs
              ;;
            ownership)
              xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp -extension MIT-SHM' node tests/renderer-ownership-hmr-electron-smoke.cjs
              ;;
            *) exit 2 ;;
          esac
      - name: Verify the original source and compiled build are preserved
        run: node tests/helpers/verified-ci-build.cjs
      - name: Save focused native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-native-diagnostic-${{ matrix.suite }}-proof
          path: |
            output/native-diagnostics/
            output/playwright/active-recovery-run/
          if-no-files-found: warn
