name: Release Life

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and release'
        required: true
        type: string
      source_ref:
        description: 'Source commit, branch, or tag for a rebuild (defaults to the version tag)'
        required: false
        type: string

permissions:
  contents: read

env:
  LIFE_RELEASE_REF: ${{ inputs.source_ref || inputs.tag || github.ref }}
  LIFE_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      windows_baselines: ${{ steps.versions.outputs.windows_baselines }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LIFE_RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        run: node -e "if (process.env.LIFE_RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag must match package.json version')"
      - name: Record release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check out maintained release baseline selection
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-verification
          sparse-checkout: scripts/release-baselines.cjs
          sparse-checkout-cone-mode: false
      - name: Select latest preceding Windows upgrade baseline
        id: versions
        run: node .release-verification/scripts/release-baselines.cjs package.json >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run test:recovery
      - run: node tests/thread-queue-smoke.cjs
      - run: node tests/thread-presentation-smoke.cjs
      - run: node tests/studio-lifecycle-smoke.cjs
      - run: node tests/app-live-controls-smoke.cjs
      - run: node tests/app-live-controls-smoke.cjs --presentation
      - name: Verify native history hydration
        run: |
          if node -e "process.exit(require('node:fs').readFileSync('tests/app-live-controls-smoke.cjs', 'utf8').includes('--history-hydration') ? 0 : 1)"; then
            node tests/app-live-controls-smoke.cjs --history-hydration
          fi
      - name: Verify provider utilities in the desktop interface
        run: |
          if node -e "process.exit(require('node:fs').readFileSync('tests/app-live-controls-smoke.cjs', 'utf8').includes('--provider-utilities') ? 0 : 1)"; then
            node tests/app-live-controls-smoke.cjs --provider-utilities
          fi
      - run: node tests/run-selectors-smoke.cjs
      - run: node tests/research-method-ui-smoke.cjs
      - run: node tests/provider-request-ui-smoke.cjs
        if: hashFiles('tests/provider-request-ui-smoke.cjs') != ''
      - run: node tests/conversation-scroll-smoke.cjs
        if: hashFiles('tests/conversation-scroll-smoke.cjs') != ''
      - run: node tests/provider-updates-ui-smoke.cjs
        if: hashFiles('tests/provider-updates-ui-smoke.cjs') != ''
      - run: node tests/usage-smoke.cjs
        if: hashFiles('tests/usage-smoke.cjs') != ''
      - run: xvfb-run -a npm run test:desktop

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            args: --linux --x64
          - platform: windows-x64
            runner: windows-latest
            args: --win --x64
          - platform: macos-arm64
            runner: macos-latest
            args: --mac --arm64
          - platform: macos-x64
            runner: macos-15-intel
            args: --mac --x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Verify packaged Windows live customization
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./tests/windows-source-runtime.ps1
      - name: Save Windows customization proof
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: life-windows-customization-proof
          path: output/source-runtime-proof.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: life-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  windows-upgrade:
    needs: [verify, build]
    if: needs.verify.outputs.windows_baselines != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        baseline: ${{ fromJSON(needs.verify.outputs.windows_baselines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: life-windows-x64
          path: release
      - name: Check out maintained Windows verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-verification
          sparse-checkout: tests/windows-upgrade.ps1
          sparse-checkout-cone-mode: false
      - name: Verify Windows upgrade from Life ${{ matrix.baseline }}
        shell: pwsh
        env:
          BASELINE_VERSION: ${{ matrix.baseline }}
        run: ./.release-verification/tests/windows-upgrade.ps1 -Installer (Get-ChildItem release/*.exe | Select-Object -First 1).FullName -ExpectedVersion (Get-Content -Raw package.json | ConvertFrom-Json).version -BaselineVersions @($env:BASELINE_VERSION)
      - name: Save Windows upgrade proof
        uses: actions/upload-artifact@v4
        with:
          name: life-windows-upgrade-proof-${{ matrix.baseline }}
          path: output/windows-upgrade-proof.json
          if-no-files-found: error

  publish:
    needs: [verify, build, windows-upgrade]
    if: ${{ always() && needs.verify.result == 'success' && needs.build.result == 'success' && (needs.windows-upgrade.result == 'success' || needs.windows-upgrade.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          path: checkout
      - name: Check out maintained release assembly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-verification
          sparse-checkout: |
            scripts/prepare-release.cjs
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .release-verification/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .release-verification
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Validate installers and merge architecture metadata
        run: node .release-verification/scripts/prepare-release.cjs artifacts installers "${LIFE_RELEASE_TAG#v}"
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.LIFE_RELEASE_TAG }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd installers
          sha256sum Life-* latest*.yml > SHA256SUMS.txt
          notes="../checkout/docs/release-notes-${RELEASE_TAG}.md"
          cp "$notes" release-notes.md
          printf '\nBuild source: [%s](https://github.com/%s/commit/%s).\n' "$SOURCE_COMMIT" "$GH_REPO" "$SOURCE_COMMIT" >> release-notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Life $RELEASE_TAG" --notes-file release-notes.md
          fi
          assets=(Life-* latest*.yml SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --title "Life $RELEASE_TAG" --notes-file release-notes.md
