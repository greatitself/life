name: Publish Life 0.13.0 installers
run-name: Life 0.13.0 packages (known test failures disclosed)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LIFE_PACKAGE_SOURCE: c9e4c164771fbf339419fcc48bc36c4804b0d636

jobs:
  build:
    name: Package ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            args: --linux --x64
          - platform: windows-x64
            runner: windows-latest
            args: --win --x64
          - platform: macos-arm64
            runner: macos-latest
            args: --mac --arm64
          - platform: macos-x64
            runner: macos-15-intel
            args: --mac --x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LIFE_PACKAGE_SOURCE }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check pinned release source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$LIFE_PACKAGE_SOURCE"
          node -e "if (require('./package.json').version !== '0.13.0') throw new Error('Wrong version')"
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: life-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LIFE_PACKAGE_SOURCE }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: life-*
          path: artifacts
      - name: Validate installer sizes and hashes and merge macOS updater metadata
        run: node scripts/prepare-release.cjs artifacts installers 0.13.0
      - name: Publish installers and checksums with known failures disclosed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd installers
          sha256sum Life-* latest*.yml > SHA256SUMS.txt
          python3 - <<'PYNOTES'
          from pathlib import Path
          notes = Path('../docs/release-notes-v0.13.0.md').read_text()
          notes = notes[:notes.index('## Release validation')] + """## Verification status

          Typecheck, the unit suite, and the production build passed in [CI](https://github.com/greatitself/life/actions/runs/38679238751). Two checks failed: Studio keyboard-focus restoration and native connection switching. The full integrated native recovery matrix and packaged compatibility checks are not certified. No passing result is claimed for cancelled checks.

          Installers were built from source commit `c9e4c164771fbf339419fcc48bc36c4804b0d636`. Release assembly verified installer sizes, SHA-512 updater metadata, and merged macOS metadata. SHA-256 checksums are attached. Windows and macOS packages follow the existing unsigned release policy.
          """
          notes = notes.replace('(native-active-recovery.md)', '(https://github.com/greatitself/life/blob/v0.13.0/docs/native-active-recovery.md)')
          Path('../published-release-notes.md').write_text(notes)
          PYNOTES
          gh release upload v0.13.0 Life-* latest*.yml SHA256SUMS.txt --clobber
          gh release edit v0.13.0 --draft=false --latest --notes-file ../published-release-notes.md
