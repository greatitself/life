name: Release Life

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and release'
        required: true
        type: string

permissions:
  contents: read

env:
  LIFE_RELEASE_REF: ${{ inputs.tag || github.ref }}
  LIFE_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LIFE_RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        run: node -e "if (process.env.LIFE_RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag must match package.json version')"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run test:recovery
      - run: xvfb-run -a npm run test:desktop

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            args: --linux --x64
          - platform: windows-x64
            runner: windows-latest
            args: --win --x64
          - platform: macos-arm64
            runner: macos-latest
            args: --mac --arm64
          - platform: macos-x64
            runner: macos-15-intel
            args: --mac --x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LIFE_RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Verify packaged Windows live customization
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./tests/windows-source-runtime.ps1
      - name: Save Windows customization proof
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: life-windows-customization-proof
          path: output/source-runtime-proof.json
          if-no-files-found: error
      - name: Check out maintained Windows verification
        if: matrix.platform == 'windows-x64'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-verification
          sparse-checkout: tests/windows-upgrade.ps1
          sparse-checkout-cone-mode: false
      - name: Verify Windows upgrades from Life 0.1.0 and 0.5.1
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./.release-verification/tests/windows-upgrade.ps1 -Installer (Get-ChildItem release/*.exe | Select-Object -First 1).FullName -ExpectedVersion (Get-Content -Raw package.json | ConvertFrom-Json).version -BaselineVersions @('0.1.0','0.5.1')
      - name: Save Windows upgrade proof
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: life-windows-upgrade-proof
          path: output/windows-upgrade-proof.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: life-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.LIFE_RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          cd installers
          sha256sum Life-* latest*.yml > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Life 0.6.0 incorporates the workspace customization backup and fixes project, conversation and renderer stability.

          - Fix the black screen when adding or selecting a project: absent attachment progress can no longer dereference an undefined value and unmount the application.
          - Saved threads automatically restore their machine and project. Context changes are serialized and obsolete requests cannot send prompts into another folder.
          - Codex resumes request metadata without downloading full remote history. Oversized or invalid frames produce explicit errors, and canceled or failed transports release affected turns promptly while preserving remote conversation IDs.
          - SSH directory, SFTP and command requests have bounded deadlines and settle on disconnect. Failed project selection unlocks for retry; late callbacks cannot replace the current context.
          - Large edit summaries use one bounded diff computation, cached previews and memoized historical turns instead of repeatedly blocking the renderer.
          - Late React failures show a recovery panel. Native renderer crashes and frozen windows have bounded recovery choices, retaining saved data, machine state and window geometry.
          - Emergency extension recovery opens one review dialog and keeps SSH disconnected. It preserves saved threads and remote conversation IDs; selecting a thread later restores its project normally.
          - All 27 supplied workspace customizations are permanently included: project-grouped search/filter/sort, settle and snooze, resizable/collapsible rails, attachments and uploads, queued follow-ups, compact activity timelines, message navigation, provider artwork and the reference composer.
          - Browser, Terminal, Files, Diff, Git and pull-request surfaces, branch and host details, Radix run menus, and export-all extension backup are included in the installed interface.
          - Exact incorporated source bundles become exportable Built into Life archive records. Matching includes the entire bundle content; modified or unrelated extensions are preserved for adaptation.
          - Prompt-driven source extensions, public Gist sharing, research maps, SSH config aliases, provider controls and automatic port forwarding remain available.
          - Windows upgrades the existing Life installation and preserves its local data. CI verifies upgrades from both 0.1.0 and 0.5.1, alongside packaged source compilation and extension checks.

          Run the new Windows .exe over the current installation, or use Updates on Life 0.2.2 or later. Profiles, conversation history, research data, extensions and local source files remain in the existing data directory. The incorporated backup needs no import or rebuild. Other source customizations are preserved when the installed baseline changes; ask /life to adapt them before enabling. This is not an automatic semantic merge of arbitrary edits.

          Passwords and key passphrases are never stored; reconnecting profiles that require them still needs credentials. Provider CLIs must be installed and authenticated on the remote machine. Browser embedding depends on the remote site's frame policy, and pull-request details require remote GitHub CLI authentication. The native host, preload and recovery loader remain the installed copy during live source customization.

          Agent CLIs must be installed and signed in on the remote Linux or macOS machine. Signing is deferred until publisher credentials are provided: builds remain unsigned, macOS may require Open Anyway and Windows may show an unrecognized publisher prompt. macOS and Debian updates use the new installer; AppImage and Windows support in-app updates.
          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Life $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" Life-* latest*.yml SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
