name: Verify thread feedback

on:
  push:
    branches: [feedback/settle-snooze]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Thread state and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify organization, deadlines, history and recovery
        run: |
          mkdir -p output/thread-feedback
          npm test -- --maxWorkers=1 tests/thread-management.test.ts tests/thread-snooze-presets.test.ts tests/thread-snooze-clock.test.ts tests/native-renderer-recovery.test.ts tests/sidebar-clock.test.ts tests/sidebar-history.test.ts tests/thread-presentation.test.ts 2>&1 | tee output/thread-feedback/unit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thread-feedback-unit
          path: output/thread-feedback/
          if-no-files-found: warn

  async-questions:
    name: Async questions and native callback recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select explicit question, protocol and recovery test paths
        run: |
          mkdir -p output/thread-feedback
          node <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          const required = [
            'tests/question-answers.test.ts',
            'tests/codex-requests.test.ts',
            'tests/claude-requests.test.ts',
            'tests/agents-claude-elicitation.test.ts',
            'tests/agents-live-controls.test.ts',
            'tests/agent-native-recovery.test.ts',
            'tests/agents-native-recovery.test.ts',
            'tests/studio-planner-recovery.test.ts',
            'tests/studio-history-recovery.test.ts',
            'tests/studio-history-restore.test.ts',
            'tests/thread-event-state.test.ts',
            'tests/native-renderer-recovery.test.ts',
            'tests/ssh-request-lifecycle.test.ts',
            'tests/ssh-agents.integration.test.ts',
          ]
          for (const file of required) assert(fs.statSync(file).isFile(), 'Missing required test: ' + file)
          const questions = fs.readdirSync('tests')
            .filter(name => /(?:^|-)async-question[^/]*\.test\.ts$/.test(name) || name === 'pending-question-drafts.test.ts')
            .map(name => 'tests/' + name)
            .filter(file => fs.statSync(file).isFile())
          assert(questions.length > 0, 'No async question or question draft tests were discovered')
          const tests = [...new Set([...required, ...questions])].sort()
          const source = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          const command = ['npm', 'test', '--', '--maxWorkers=1', ...tests]
          fs.writeFileSync('output/thread-feedback/question-tests.json', JSON.stringify({ source, questions, tests, command }, null, 2) + '\n')
          console.log(tests.join('\n'))
          NODE
      - name: Verify drafts, async ownership and exact native question responses
        run: |
          node <<'NODE' 2>&1 | tee output/thread-feedback/async-questions.log
          const fs = require('node:fs')
          const { spawnSync } = require('node:child_process')
          const { tests } = JSON.parse(fs.readFileSync('output/thread-feedback/question-tests.json'))
          // Pass only existing, explicit filenames. Vitest receives no literal
          // wildcard patterns that could silently fail to select new suites.
          const result = spawnSync('npm', ['test', '--', '--maxWorkers=1', ...tests], { stdio: 'inherit' })
          if (result.error) throw result.error
          if (result.signal) throw new Error('Question verification terminated: ' + result.signal)
          process.exitCode = result.status ?? 1
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thread-feedback-async-questions
          path: output/thread-feedback/
          if-no-files-found: warn

  build:
    name: Build candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with the required typecheck
        run: |
          mkdir -p output/thread-feedback
          npm run build 2>&1 | tee output/thread-feedback/build.log
          git rev-parse HEAD > output/thread-feedback/build-source.txt
          tar -czf output/thread-feedback/build.tgz out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thread-feedback-build
          path: output/thread-feedback/
          if-no-files-found: warn

  browser:
    name: Browser / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite:
          [
            thread-workflows,
            renderer-recovery,
            thread-queue,
            provider-request-ui,
            pending-question-ui,
            app-live-controls,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Exercise the existing browser fixture
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p output/thread-feedback
          args=()
          if [ "$SUITE" = app-live-controls ]; then args+=(--fluidity); fi
          node "tests/$SUITE-smoke.cjs" "${args[@]}" 2>&1 | tee "output/thread-feedback/$SUITE.log"
          if [ "$SUITE" = app-live-controls ]; then
            node tests/app-live-controls-smoke.cjs --async-questions 2>&1 | tee output/thread-feedback/app-live-controls-async-questions.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thread-feedback-browser-${{ matrix.suite }}
          path: |
            output/thread-feedback/
            output/playwright/
          if-no-files-found: warn

  desktop:
    name: Native Electron integration
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: thread-feedback-build
          path: output/thread-feedback/build
      - name: Restore the candidate build
        run: |
          test "$(cat output/thread-feedback/build/build-source.txt)" = "$(git rev-parse HEAD)"
          tar -xzf output/thread-feedback/build/build.tgz
      - run: npx playwright install-deps chromium
      - name: Verify native integration with disposable provider stand-ins
        env:
          LIFE_TEST_SOURCE: "1"
          LIFE_TEST_PACKAGED: "0"
          LIFE_TEST_ARTIFACTS_DIR: output/thread-feedback/desktop
          LIFE_TEST_SCREENSHOTS_DIR: output/thread-feedback/desktop/screenshots
        run: |
          mkdir -p output/thread-feedback
          xvfb-run -a -s '-screen 0 1920x1200x24 -nolisten tcp -extension MIT-SHM' npm run test:desktop 2>&1 | tee output/thread-feedback/desktop.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thread-feedback-desktop
          path: |
            output/thread-feedback/desktop/
            output/thread-feedback/desktop.log
          if-no-files-found: warn

  sidebar-performance:
    name: Same-fixture sidebar comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - uses: actions/checkout@v4
        with:
          ref: 05c07f0f426ec14fdb9923c5edf949aa33aa7e44
          path: .performance-baseline
      - name: Record the selector overlay and require identical fixtures and dependencies
        run: |
          cmp package-lock.json .performance-baseline/package-lock.json
          cmp tests/helpers/browser-build.cjs .performance-baseline/tests/helpers/browser-build.cjs
          git -C .performance-baseline diff --exit-code HEAD -- src
          test -z "$(git -C .performance-baseline status --porcelain --untracked-files=all -- src)"
          ln -s "$GITHUB_WORKSPACE/node_modules" .performance-baseline/node_modules
          mkdir -p output/thread-feedback
          node <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const { execFileSync } = require('node:child_process')
          const commit = cwd => execFileSync('git', ['rev-parse', 'HEAD'], { cwd, encoding: 'utf8' }).trim()
          const hash = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')
          const expectedBaseline = '05c07f0f426ec14fdb9923c5edf949aa33aa7e44'
          assert.equal(commit('.performance-baseline'), expectedBaseline)
          const fixture = 'tests/sidebar-history-performance.cjs'
          const baselineFixture = '.performance-baseline/' + fixture
          const originalBaselineFixtureSha256 = hash(baselineFixture)
          fs.copyFileSync(fixture, baselineFixture)
          assert.equal(hash(baselineFixture), hash(fixture))
          const proof = {
            candidate: commit('.'), baseline: commit('.performance-baseline'), baselineRef: expectedBaseline,
            baselineSourceTree: execFileSync('git', ['rev-parse', 'HEAD:src'], { cwd: '.performance-baseline', encoding: 'utf8' }).trim(),
            fixtureSha256: hash(fixture),
            fixtureOverlay: {
              path: fixture, originalBaselineSha256: originalBaselineFixtureSha256,
              appliedBaselineSha256: hash(baselineFixture), candidateSha256: hash(fixture),
              reason: 'Identical card-shell status selectors for the old and new DOM; the workload, assertions and production source are unchanged',
            },
            helperSha256: hash('tests/helpers/browser-build.cjs'), lockfileSha256: hash('package-lock.json'),
            order: ['before-a', 'candidate-a', 'candidate-b', 'before-b'],
            scope: 'Production sidebar fixture with deterministic histories; no authenticated upstream provider use',
          }
          fs.writeFileSync('output/thread-feedback/sidebar-provenance.json', JSON.stringify(proof, null, 2) + '\n')
          NODE
          cmp tests/sidebar-history-performance.cjs .performance-baseline/tests/sidebar-history-performance.cjs
          git -C .performance-baseline diff --exit-code HEAD -- src
      - name: Measure complete source trees in baseline-candidate-candidate-baseline order
        run: |
          # Labels containing "baseline" select an unrelated historical overlay
          # inside this fixture. These labels retain the current assertions and
          # measure the complete pinned pre-alignment or candidate source tree.
          (cd .performance-baseline && node tests/sidebar-history-performance.cjs before-a) 2>&1 | tee output/thread-feedback/sidebar-before-a.log
          node tests/sidebar-history-performance.cjs candidate-a 2>&1 | tee output/thread-feedback/sidebar-candidate-a.log
          node tests/sidebar-history-performance.cjs candidate-b 2>&1 | tee output/thread-feedback/sidebar-candidate-b.log
          (cd .performance-baseline && node tests/sidebar-history-performance.cjs before-b) 2>&1 | tee output/thread-feedback/sidebar-before-b.log
      - name: Report both runs without imposing a timing threshold
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const provenance = JSON.parse(fs.readFileSync('output/thread-feedback/sidebar-provenance.json'))
          const rows = provenance.order.map(label => {
            const root = label.startsWith('before-') ? '.performance-baseline' : '.'
            const proof = JSON.parse(fs.readFileSync(path.join(root, 'output/playwright/sidebar-history-performance', label + '.json')))
            return { label, sort: proof.sort, search: proof.search, clock: proof.clock, fixture: proof.fixture }
          })
          fs.writeFileSync('output/thread-feedback/sidebar-comparison.json', JSON.stringify({ provenance, rows }, null, 2) + '\n')
          const lines = [
            'Same sidebar fixture: pinned pre-alignment 05c07f0 versus candidate, measured sequentially in ABBA order.',
            'Only the disclosed card-shell status selector overlay is applied to the older fixture; both trees run identical fixture bytes with every assertion and workload preserved.',
            '',
            '| Run | Sort median / p95 (ms) | Search median / p95 (ms) |',
            '| --- | --- | --- |',
            ...rows.map(row => '| ' + row.label + ' | ' + row.sort.medianMs + ' / ' + row.sort.p95Ms + ' | ' + row.search.medianMs + ' / ' + row.search.p95Ms + ' |'),
            '',
            'Timing is fixture evidence. Functional assertions remain enabled in all four runs; authenticated provider use is outside this workflow.',
            'The normal Verify Life and release gates remain required.',
          ]
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n')
          NODE
      - name: Require the older production source to remain unchanged
        if: always()
        run: |
          git -C .performance-baseline diff --exit-code HEAD -- src
          test -z "$(git -C .performance-baseline status --porcelain --untracked-files=all -- src)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thread-feedback-sidebar-comparison
          include-hidden-files: true
          path: |
            tests/sidebar-history-performance.cjs
            tests/helpers/browser-build.cjs
            .performance-baseline/tests/sidebar-history-performance.cjs
            output/thread-feedback/
            output/playwright/sidebar-history-performance/
            .performance-baseline/output/playwright/sidebar-history-performance/
          if-no-files-found: warn
