name: Publish Life browser preview

on:
  push:
    branches: [main]
    paths:
      - src/renderer/**
      - src/shared/**
      - package.json
      - package-lock.json
      - vite.web.config.ts
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: life-browser-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/web-research.test.ts
      - run: npm run build:web
      - run: npx playwright install chromium --with-deps
      - run: npm run test:web-preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser preview
        id: deployment
        uses: actions/deploy-pages@v4
