name: Release Life

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and release'
        required: true
        type: string

permissions:
  contents: read

env:
  LIFE_RELEASE_REF: ${{ inputs.tag || github.ref }}
  LIFE_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LIFE_RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        run: node -e "if (process.env.LIFE_RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag must match package.json version')"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: xvfb-run -a npm run test:desktop

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            args: --linux --x64
          - platform: windows-x64
            runner: windows-latest
            args: --win --x64
          - platform: macos-arm64
            runner: macos-latest
            args: --mac --arm64
          - platform: macos-x64
            runner: macos-15-intel
            args: --mac --x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LIFE_RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Verify packaged Windows live customization
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./tests/windows-source-runtime.ps1
      - name: Save Windows customization proof
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: life-windows-customization-proof
          path: output/source-runtime-proof.json
          if-no-files-found: error
      - name: Check out maintained Windows verification
        if: matrix.platform == 'windows-x64'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-verification
          sparse-checkout: tests/windows-upgrade.ps1
          sparse-checkout-cone-mode: false
      - name: Verify Windows upgrade from Life 0.1.0
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./.release-verification/tests/windows-upgrade.ps1 -Installer (Get-ChildItem release/*.exe | Select-Object -First 1).FullName -ExpectedVersion (Get-Content -Raw package.json | ConvertFrom-Json).version
      - uses: actions/upload-artifact@v4
        with:
          name: life-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.LIFE_RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          cd installers
          sha256sum Life-* latest*.yml > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Life 0.4 edits its actual React application from any Codex or Claude Code thread.

          - Edit built-in React/TypeScript components, shared code and CSS through /life or @life in the existing conversation.
          - Add npm dependencies and actual component source, including shadcn/Radix components, with optional Tailwind v4 generation when the required packages and styles are proposed. Bundled npm and esbuild stage and compile changes locally without requiring a separate Node.js installation.
          - Automatic source reads supply exact files to the same provider session. Failed proposals/builds retain the working interface and return diagnostics for bounded repair attempts.
          - Revision checks, conversation persistence before reload, source management, rollback and the native Ctrl/Cmd + Shift + L recovery route protect ongoing work.
          - Discover models and reasoning/speed capabilities from the connected providers. Supported choices persist per thread; unsupported choices return to provider defaults without automatically enabling a paid fast tier.
          - Advanced Codex thread/turn options, Claude settings/arguments and executable Node workers can implement additional agent and local behavior.
          - Research maps, monochrome themes, SSH config aliases, project selection and automatic port forwarding remain available.
          - Windows upgrades the existing Life installation and preserves its local data; Windows and AppImage support in-app updates.

          Windows users on 0.1.0: run the new .exe once to upgrade. Existing users on 0.2.2 or later can use Updates inside Life. Profiles, conversation history, research data, extensions and local source files remain in the existing data directory. When an update changes the built-in source baseline, Life preserves custom files and starts with its built-in interface; ask /life to update your customization, refreshing unchanged files during the next build.

          Existing select controls are unchanged so users can test Life's customization themselves. Ask /life to replace a control with real React component source and dependencies. The native host, preload and recovery loader remain the installed copy; native binaries and installer signing require a packaged release.

          Agent CLIs must be installed and signed in on the remote Linux or macOS machine. Signing is deferred until publisher credentials are provided: builds remain unsigned, macOS may require Open Anyway and Windows may show an unrecognized publisher prompt. macOS and Debian updates use the new installer; AppImage and Windows support in-app updates.
          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Life $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" Life-* latest*.yml SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
